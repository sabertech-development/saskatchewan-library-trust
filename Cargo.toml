[package]
name = "saskatchewan-library-funding"
version = "0.1.0"
edition = "2024"
description = "Saskatchewan Private Equity Library Funding — an interactive proposal for review"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "library-funding"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location", "Navigator", "Clipboard", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Element", "HtmlElement"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
